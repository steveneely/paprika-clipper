<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paprika Clipper — Unofficial Extension</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header>
      <img class="mark" src="icons/icon.svg" alt="" width="38" height="38">
      <div class="brand"><span class="brand-name">Paprika Clipper</span></div>
    </header>
    <div class="content">
      <section aria-live="polite" aria-atomic="true">
        <h1 id="heading" hidden></h1>
        <p id="message">Sign in on Paprika’s website.</p>
      </section>
      <div class="actions">
        <button id="connect" aria-describedby="signin-note" hidden>Connect Paprika <span aria-hidden="true">↗</span></button>
        <button id="retry" hidden>Try again</button>
      </div>
      <p id="signin-note">We never see your password. Your connection token is stored in this browser.</p>
    </div>
    <div id="account-row" class="account-row" hidden><span id="connection" class="connection" role="status">Connected</span><button id="disconnect" class="text-button" hidden>Disconnect</button></div>
    <footer>Unofficial · Not affiliated with Paprika or Hindsight Labs.</footer>
  </main>
</body>
</html>
